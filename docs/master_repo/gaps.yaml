  - canonical: "Hedge fund quant-research (pure research)"
    severity: soft
    aliases: ["hedge fund quant research", "portfolio construction HF", "statistical arbitrage"]
    adjacent_note: "Buy-side ALM/LDI adjacent, not HF primary"

  - canonical: "Reserving actuary / pricing actuary (credentialed)"
    severity: soft
    aliases: ["reserving actuary", "pricing actuary", "FSA", "FCAS", "FCIA"]
    adjacent_note: "IFRS 17/9 delivery exposure; not a credentialed actuary"
