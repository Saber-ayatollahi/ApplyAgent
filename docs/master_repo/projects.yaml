# Project records — first-class deliverables, not buried sub-bullets. Each has
# enough structure to feed a scorer's coverage query AND a tailor's bullet
# reuse. Keep stack/scale grounded in what actually shipped; no inflation.
---
projects:
  - id: proj_cashflow_engine
    name: "Enterprise multi-asset cash flow projection engine"
    role_id: role_moodys
    phase_id: role_moodys_phase2
    period_display: "2024 – 2025"
    status: "Shipped / production"
    problem: >
      Buy-side clients needed forward-looking liquidity visibility with
      reverse-stress and behavioral cashflow coverage across multi-asset
      ALM horizons. Prior approach was manual-spreadsheet-based, not
      auditable, and not scalable to the breadth of client portfolios.
    approach: >
      Designed configurable time-bucketed liquidity gap analytics (T+1
      through multi-year) with embedded behavioral cashflow assumptions,
      prepayment logic, and macro stress overlays. Delivered an enterprise
      engine supporting base, stress, and reverse-stress scenarios and
      re-engineered upstream spreadsheet workflows into scalable auditable
      Python analytics pipelines.
    stack: ["Python", "pandas", "NumPy", "SciPy"]
    scale:
      client_portfolios_covered: "multiple"
      portfolio_size_range_usd: "$5bn – $25bn per engagement"
      cumulative_aum_usd: "~$50bn+"
      horizon: "overnight (T+1) to multi-year"
    skill_ids:
      - sk_alm
      - sk_irrbb
      - sk_liquidity_gap
      - sk_cash_flow_projection
      - sk_stress_testing
      - sk_python
      - sk_model_signoff
      - sk_audit_documentation
    outcomes:
      - "Shipped production engine delivering forward-looking liquidity visibility across ALM horizons."
      - "Unlocked analytical capability (reverse-stress, behavioral cashflow) that clients had been asking for."
      - "Reduced manual spreadsheet workflow time materially and improved auditability for model-governance audit."
    narrative_for_section3_md: |
      - **Led design and implementation** of an enterprise multi-asset **cash flow projection engine** supporting base, stress, and reverse-stress scenarios — providing forward-looking liquidity visibility across ALM horizons.
      - Architected configurable **time-bucketed liquidity gap analytics** (T+1 through multi-year) enabling funding optimization, refinancing risk assessment, and asset-allocation decisions.
      - Embedded behavioral cash flow assumptions, prepayment logic, and macro stress overlays aligned with regulatory liquidity expectations.
      - Re-engineered manual spreadsheet workflows into scalable, auditable Python analytics pipelines.

  - id: proj_agentic_ai_workflows
    name: "Agentic AI development workflows"
    role_id: role_moodys
    phase_id: role_moodys_phase2
    period_display: "2024 – Present"
    status: "In production / expanding"
    problem: >
      Validation workload expanding faster than headcount; repetitive code
      generation, scaffolding, and documentation were eating senior review
      cycles.
    approach: >
      Built agentic AI workflows using Claude Code CLI and Cursor IDE —
      automated first-pass code generation, validation scaffolding,
      anomaly detection, and documentation. Human sign-off retained for
      governance-critical review.
    stack: ["Claude Code", "Cursor IDE", "Python"]
    scale:
      cycle_time_reduction: "~30-40% on comparable modules"
    skill_ids:
      - sk_python
      - sk_claude_code
      - sk_cursor_ide
      - sk_agent_dev
      - sk_llm_codegen
    outcomes:
      - "Cycle time on comparable validation modules dropped ~30–40%."
      - "Approach being explored for broader team adoption."
      - "Reusable portfolio piece for AI-forward interviews."
    narrative_for_section3_md: |
      - Built **agentic AI development workflows** using Claude Code and Cursor IDE — automated code generation, validation scaffolding, anomaly detection, and documentation — reducing development cycle time by an estimated 30–40% on comparable modules.

  - id: proj_spreadsheet_to_python_migration
    name: "Valuation workflow migration: spreadsheet → Python pipeline"
    role_id: role_moodys
    phase_id: role_moodys_phase2
    period_display: "Moody's Phase 2"
    status: "Shipped"
    problem: >
      A production valuation workflow was spreadsheet-driven with limited
      logging and no versioning — not acceptable under formal
      model-governance audit.
    approach: >
      Parallel-built Python pipeline; ran in shadow mode for two cycles;
      reconciled output against spreadsheet; cut over with documented
      rollback plan.
    stack: ["Python", "pandas"]
    skill_ids:
      - sk_python
      - sk_model_signoff
      - sk_audit_documentation
      - sk_model_review_challenge
    outcomes:
      - "Governance audit closed satisfactorily."
      - "Pipeline became template for adjacent workflows."

