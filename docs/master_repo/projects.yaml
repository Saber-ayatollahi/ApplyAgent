  - id: proj_ortec_alm_studies
    name: "ALM studies for Canadian and international pension funds"
    role_id: role_ortec
    period_display: "Feb 2019 – Sep 2021"
    status: "Delivered across multiple client mandates"
    problem: >
      Pension funds and institutional investors needed forward-looking
      assessment of funding ratios, duration mismatch, and long-term
      balance-sheet risk under base and stressed environments.
    approach: >
      Delivered full ALM studies — analyzed funding ratios, duration
      mismatch, long-term risk exposures; advised on Strategic Asset
      Allocation (SAA) and Tactical Asset Allocation (TAA) trade-offs;
      designed stochastic risk-management frameworks tailored to client
      mandates; presented findings to investment committees on-site.
    skill_ids:
      - sk_alm
      - sk_funding_ratio
      - sk_duration_gap
      - sk_multiperiod_bs_risk
      - sk_stress_testing
      - sk_investment_committee_presentation
    outcomes:
      - "Clients returned for subsequent studies."
      - "Frameworks reused across mandates."

  - id: proj_ortec_scenario_generators
    name: "Stochastic economic scenario generators"
    role_id: role_ortec
    period_display: "Feb 2019 – Sep 2021"
    status: "Delivered in client engagements"
    problem: >
      Client ALM and LDI studies needed calibrated stochastic paths for
      interest rates, inflation, equity, and credit to drive funding-ratio
      distributions under base and stressed environments.
    approach: >
      Built and interpreted stochastic economic scenario generators
      calibrated to client assumptions; ran funding-ratio distributions;
      decomposed duration-gap contribution to funding-ratio volatility;
      translated stochastic outputs into investment-committee narratives.
    skill_ids:
      - sk_stochastic_modelling
      - sk_scenario_generator
      - sk_yield_curve
      - sk_stress_testing
    outcomes:
      - "Calibrated generators integrated into multiple pension-fund ALM studies."

  - id: proj_ortec_ldi_studies
    name: "LDI strategy studies for pension-fund clients"
    role_id: role_ortec
    period_display: "Feb 2019 – Sep 2021"
    status: "Delivered across pension-fund engagements"
    problem: >
      Pension-fund clients questioned whether fixed-income duration
      positioning was appropriate given liability-duration extension.
    approach: >
      Quantified return/duration/liquidity trade-offs; presented explicit
      SAA recommendations to investment committees grounded in stochastic
      funding-ratio distributions.
    skill_ids:
      - sk_ldi
      - sk_duration_gap
      - sk_funding_ratio
      - sk_stochastic_modelling
      - sk_investment_committee_presentation
    outcomes:
      - "At least one client adopted a duration-extension recommendation following presentation to investment committee."
