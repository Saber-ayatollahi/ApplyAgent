# §5 — Tagged bullet library. Each bullet is a first-class record with:
#   - variant_tags: which resume variant(s) it belongs to
#   - role_id / project_id: traceability back to the work
#   - skill_ids: which evidenced skills this bullet demonstrates
#   - has_metric: is there a quantified claim?
#   - length: short (LinkedIn) | med (cover letter) | full (resume)
#   - text: the exact bullet text used in the rendered .md
#
# The tailor selects bullets by a boolean filter over tags/skills rather than
# re-generating them from prose. Don't edit `text` here and expect it to stay —
# the .md is regenerated from this file.
---
variant_tags_legend:
  ALM: "ALM / IRRBB / Balance-Sheet-Risk resume"
  VAL: "Model Validation / Model Risk resume"
  VEN: "Vendor-platform / Client Solutions resume (BlackRock Aladdin, Bloomberg, MSCI, S&P)"
  QUANT: "Quantitative / Fixed Income Analytics resume"
  CON: "Consulting / Advisory resume (Mercer, WTW, Deloitte FSI, EY FSRM boomerang)"
  AI: "AI-in-finance angle (add sparingly — only for AI-forward roles)"

section_groups:
