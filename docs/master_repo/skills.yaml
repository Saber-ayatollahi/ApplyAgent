# §4 — Skills inventory (evidenced). Every skill has:
#   - level: expert | proficient | familiar | not_hands_on
#   - years: integer (cumulative hands-on)
#   - aliases: ATS/JD synonyms the same skill appears under
#   - evidence_project_ids / evidence_role_ids: traceability back to work
#   - interview_depth: true if defensible in 30-min technical grill
#
# Level definitions:
#   expert       — can teach it, defend it under deep technical grilling,
#                  has shipped production work relied on by others.
#   proficient   — has shipped in production, can converse with experts,
#                  would pass a screening question cold.
#   familiar     — has used / understands at a working level; could
#                  execute with context but not an authority.
#   not_hands_on — surface-area exposure only; DO NOT claim on resume;
#                  address obliquely via adjacent skills if asked.
#
# Rule: No skill in this file without evidence in roles.yaml / projects.yaml.
# The `gaps` section explicitly lists the NOT-hands-on items so the scorer can
# correctly answer "can this candidate hit the ground running?"
